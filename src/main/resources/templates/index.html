<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL shortener</title>
    <style>
        body { font: 1rem system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
        form { display: flex; gap: .5rem; }
        input { flex: 1; min-width: 0; padding: .5rem; }
        button { padding: .5rem 1rem; }
        li { margin: .75rem 0; overflow-wrap: anywhere; }
        .error { color: #a00; }
        .version { background: #e7f2ff; border-left: 4px solid #2769b1; padding: .75rem 1rem; }
    </style>
</head>
<body>
<h1>URL shortener</h1>
<p class="version">Running build <code th:text="${appVersion}">local</code> · Click tracking enabled</p>
<form th:action="@{/links}" method="post">
    <input name="targetUrl" type="url" placeholder="https://example.com" aria-label="Target URL"
           required th:value="${targetUrl}">
    <button type="submit">Shorten</button>
</form>
<p class="error" th:if="${error}" th:text="${error}"></p>
<p th:if="${shortUrl}">Short URL: <a th:href="${shortUrl}" th:text="${shortUrl}"></a></p>
<h2>Recent links</h2>
<ul>
    <li th:each="link : ${links}">
        <a th:href="@{/{slug}(slug=${link.slug})}" th:text="${link.slug}"></a> →
        <a th:href="${link.targetUrl}" th:text="${link.targetUrl}"></a>
        <small th:text="${link.createdAt}"></small>
        <small th:text="|Clicks: ${link.clickCount}|"></small>
    </li>
</ul>
</body>
</html>
